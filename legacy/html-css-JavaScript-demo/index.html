<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML、CSS、JavaScript 联动示例</title>

  <!-- 加载同一文件夹中的 CSS，设置网页外观。 -->
  <link rel="stylesheet" href="./style.css">

  <!-- defer 让脚本等 HTML 解析完成后再执行。 -->
  <script src="./script.js" defer></script>
</head>
<body>
  <main id="card">
    <h1>我的第一个网页</h1>
    <p aria-live="polite">你已经点击了 <span id="count">0</span> 次。</p>
    <button id="button" type="button">点我：计数并切换颜色</button>
  </main>
</body>
</html>
